name: KeyDisp
options:
  bundleIdPrefix: dev.rin
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  KeyDisp:
    type: application
    platform: macOS
    sources:
      - path: KeyDisp
        excludes:
          - "*.entitlements"
    info:
      path: KeyDisp/Info.plist
      properties:
        CFBundleDisplayName: KeyDisp
        CFBundleName: KeyDisp
        CFBundleShortVersionString: "1.0.3"
        CFBundleVersion: "4"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        # Credits: con3code / Kotatsu Rin
        NSHumanReadableCopyright: "© 2026 con3code"
        NSPrincipalClass: NSApplication
        ITSAppUsesNonExemptEncryption: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: KeyDisp/KeyDisp.entitlements
      properties:
        # App Store（サンドボックス）対応版。
        # キー監視は listen-only の CGEventTap + 入力監視（Input Monitoring）権限で行う。
        # サンドボックスではアクセシビリティ権限が使えないため、判定は入力監視のみ。
        # 従来のアクセシビリティ基準の実装は legacy/developer-id ブランチにある。
        com.apple.security.app-sandbox: true
        # カスタム背景画像（ユーザーが選択したファイル）の読み取り用
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rin.KeyDisp
        MARKETING_VERSION: 1.0.3
        CURRENT_PROJECT_VERSION: 4
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        DEAD_CODE_STRIPPING: true
